<style>
  :root{
    --navy-950:#0a1424;
    --navy-900:#0f1c30;
    --navy-800:#152742;
    --navy-700:#1c3252;
    --navy-600:#2a4468;
    --gold:#c9a227;
    --gold-bright:#e6c34a;
    --ink:#eef1f6;
    --ink-dim:#9fb0c6;
    --ink-faint:#6d7f99;
    --red:#e0574c;
    --orange:#e0954c;
    --blue:#4c8ee0;
    --green:#4caf7d;
    --gray:#7a879c;
    --dark-red:#7a2e2e;
    --line: rgba(255,255,255,0.08);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 100% -10%, #16294a 0%, var(--navy-950) 55%);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    padding-bottom: 96px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 14px;}

  header.top{
    padding: max(18px, env(safe-area-inset-top)) 14px 14px;
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, rgba(10,20,36,0.97) 70%, rgba(10,20,36,0.0));
    backdrop-filter: blur(6px);
  }
  .eyebrow{
    font-family:'Space Grotesk',sans-serif;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); font-weight:600; margin:0 0 4px;
  }
  h1{
    font-size:22px; margin:0; font-weight:900; letter-spacing:-0.01em;
  }
  .sub{color:var(--ink-faint); font-size:12.5px; margin-top:3px;}

  .summary{
    margin:14px auto 6px; max-width:720px; padding:0 14px;
    display:flex; gap:10px;
  }
  .sum-card{
    flex:1; background:linear-gradient(160deg, var(--navy-800), var(--navy-900));
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  }
  .sum-card .label{font-size:11px; color:var(--ink-faint); letter-spacing:.04em;}
  .sum-card .value{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin-top:3px;}
  .sum-card.gold .value{color:var(--gold-bright);}

  .tabs{
    display:flex; gap:7px; overflow-x:auto; padding:14px 14px 4px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 13px; border-radius:999px; font-size:13px; font-weight:500;
    border:1px solid var(--line); color:var(--ink-dim); background:var(--navy-800);
    white-space:nowrap; cursor:pointer; user-select:none; transition:.15s;
  }
  .tab .cnt{opacity:.6; font-size:11px; margin-left:3px;}
  .tab.active{background:var(--gold); color:#1a1305; border-color:var(--gold); font-weight:700;}
  .tab.done-tab.active{background:var(--green); color:#08251a; border-color:var(--green);}

  .list{padding:10px 14px 0;}
  .empty{
    text-align:center; color:var(--ink-faint); padding:60px 20px; font-size:13.5px; line-height:1.7;
  }

  .card{
    background:var(--navy-800); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow); position:relative;
    border-left:4px solid var(--gray);
  }
  .card.p-1순위{border-left-color:var(--red);}
  .card.p-2순위{border-left-color:var(--orange);}
  .card.p-3순위{border-left-color:var(--blue);}
  .card.p-즉시{border-left-color:#ff3b30;}
  .card.p-보류{border-left-color:var(--gray);}
  .card.p-상환X{border-left-color:var(--dark-red);}
  .card.completed{border-left-color:var(--green); opacity:.88;}

  .row1{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .name-input{
    flex:1; background:transparent; border:none; color:var(--ink); font-size:16px; font-weight:700;
    padding:4px 2px; border-bottom:1px solid transparent;
  }
  .name-input:focus{outline:none; border-bottom:1px solid var(--gold);}
  select.prio-select{
    background:var(--navy-700); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    font-size:12px; padding:6px 8px; font-weight:600;
  }
  .badge-done{
    background:var(--green); color:#08251a; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px;
  }

  .field{margin-bottom:8px;}
  .field label{display:block; font-size:10.5px; color:var(--ink-faint); letter-spacing:.03em; margin-bottom:3px;}
  .field input{
    width:100%; background:var(--navy-700); border:1px solid var(--line); border-radius:9px;
    color:var(--ink); font-size:14px; padding:9px 10px; font-family:'Noto Sans KR',sans-serif;
  }
  .field input.amount{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--gold-bright);}
  .field input:focus{outline:none; border-color:var(--gold);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .actions{display:flex; gap:8px; margin-top:10px;}
  .btn{
    flex:1; border:none; border-radius:9px; padding:9px 10px; font-size:12.5px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .btn-done{background:rgba(76,175,125,0.15); color:var(--green); border:1px solid rgba(76,175,125,0.35);}
  .btn-restore{background:rgba(201,162,39,0.15); color:var(--gold-bright); border:1px solid rgba(201,162,39,0.35);}
  .btn-del{background:rgba(224,87,76,0.12); color:var(--red); border:1px solid rgba(224,87,76,0.3); flex:0 0 44px;}

  .fab{
    position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background:linear-gradient(160deg, var(--gold-bright), var(--gold));
    color:#1a1305; font-size:28px; font-weight:900; border:none; box-shadow:0 10px 26px rgba(201,162,39,0.4);
    cursor:pointer; z-index:30; display:flex; align-items:center; justify-content:center;
  }
  .fab:active{transform:scale(0.94);}

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(10px);
    background:var(--navy-700); border:1px solid var(--line); color:var(--ink); font-size:13px;
    padding:10px 16px; border-radius:999px; opacity:0; transition:.25s; z-index:50; pointer-events:none;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .tab-sum-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin:8px 0 20px; padding:12px 16px;
    background:var(--navy-800); border:1px solid var(--line); border-radius:12px;
  }
  .tab-sum-label{font-size:12px; color:var(--ink-faint);}
  .tab-sum-val{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:var(--gold-bright);}

  .status-bar{
    text-align:center; color:var(--ink-faint); font-size:12px; padding:20px;
  }

  /* header share button */
  .top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .share-btn{
    flex:0 0 auto; margin-top:2px; background:var(--navy-800); border:1px solid var(--line);
    color:var(--gold-bright); font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px;
    cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .share-btn:active{transform:scale(0.96);}

  .save-btn{
    flex:0 0 auto; margin-top:2px; background:var(--navy-800); border:1px solid var(--line);
    color:var(--ink-dim); font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px;
    cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; position:relative;
    transition:.15s;
  }
  .save-btn:active{transform:scale(0.96);}
  .save-btn .dot{
    width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:0 0 auto;
  }
  .save-btn.dirty{
    background:linear-gradient(160deg, var(--gold-bright), var(--gold)); color:#1a1305; border-color:var(--gold);
    box-shadow:0 6px 16px rgba(201,162,39,0.35);
  }
  .save-btn.dirty .dot{
    background:#c0392b; animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(192,57,43,0.55);}
    70%{box-shadow:0 0 0 6px rgba(192,57,43,0);}
    100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}
  }
  .save-status{font-size:10.5px; color:var(--ink-faint); margin-top:4px;}

  /* overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(4,8,16,0.72); z-index:80; display:none;
    align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:720px; max-height:92vh; overflow-y:auto;
    background:var(--navy-900); border-radius:20px 20px 0 0; border:1px solid var(--line);
    padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .sheet-head h2{font-size:16px; margin:0; font-weight:900;}
  .close-x{background:none; border:none; color:var(--ink-faint); font-size:20px; cursor:pointer; padding:4px 8px;}
  .export-actions{display:flex; gap:8px; margin-bottom:14px;}
  .export-actions .btn{flex:1; padding:11px; font-size:13px;}
  .btn-png{background:rgba(76,142,224,0.15); color:var(--blue); border:1px solid rgba(76,142,224,0.35);}
  .btn-pdf{background:rgba(201,162,39,0.15); color:var(--gold-bright); border:1px solid rgba(201,162,39,0.35);}

  /* printable/exportable compact sheet — light theme for legibility when shared */
  #shareCapture{
    background:#ffffff; color:#1c2431; border-radius:10px; padding:18px 16px; font-family:'Noto Sans KR',sans-serif;
  }
  #shareCapture h3{
    font-size:15px; margin:0 0 2px; color:#0f1c30; font-weight:900;
  }
  #shareCapture .gen-date{font-size:10.5px; color:#8792a3; margin-bottom:12px;}
  .share-totals{display:flex; gap:8px; margin-bottom:14px;}
  .share-totals div{
    flex:1; border:1px solid #e3e6ec; border-radius:8px; padding:8px 10px; background:#f7f8fa;
  }
  .share-totals .t-label{font-size:10px; color:#7a8496;}
  .share-totals .t-val{font-size:14px; font-weight:800; margin-top:2px;}
  .share-totals .paid .t-val{color:#1f8a52;}
  .share-totals .unpaid .t-val{color:#b3391f;}
  .share-sec-title{
    font-size:12px; font-weight:800; margin:14px 0 6px; padding-bottom:4px; border-bottom:2px solid #0f1c30;
  }
  table.share-table{width:100%; border-collapse:collapse; font-size:11px;}
  table.share-table th, table.share-table td{
    border:1px solid #e3e6ec; padding:5px 6px; text-align:left; vertical-align:top;
  }
  table.share-table th{background:#f1f3f6; color:#4c5568; font-weight:700; font-size:10.5px;}
  table.share-table td.amt{text-align:right; font-weight:700; white-space:nowrap;}
  table.share-table td.acc{font-size:10px; color:#5a6376;}
  table.share-table tr.paid-row td{color:#1f8a52;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <p class="eyebrow">Rootus · Deep Roots, Far Reach</p>
        <h1>채무 정리</h1>
        <p class="sub">항목을 눌러 이름·금액·계좌·비고를 바로 수정할 수 있어요.</p>
        <p class="save-status" id="saveStatus">저장됨</p>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        <button class="save-btn" id="saveBtn"><span class="dot"></span>저장</button>
        <button class="share-btn" id="shareOpenBtn">↗ 공유</button>
      </div>
    </div>
  </div>
</header>

<div class="summary">
  <div class="sum-card">
    <div class="label">상환할 금액 합계 <span style="font-size:10px;opacity:.6">(상환X 제외)</span></div>
    <div class="value" id="unpaidTotal">-</div>
  </div>
  <div class="sum-card gold">
    <div class="label">상환한 금액 합계</div>
    <div class="value" id="paidTotal">-</div>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab" title="새 항목 추가">+</button>
<div class="toast" id="toast"></div>

<!-- 공유 오버레이 -->
<div class="overlay" id="shareOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <button class="close-x" id="shareCloseBtn">← 이전</button>
      <h2>공유용 요약</h2>
      <button class="close-x" id="shareCloseBtnX">✕</button>
    </div>
    <div class="export-actions">
      <button class="btn btn-png" id="exportPngBtn">🖼 이미지로 저장</button>
      <button class="btn btn-pdf" id="exportPdfBtn">📄 PDF로 저장</button>
    </div>
    <div id="shareCapture">
      <h3>채무 정리 요약</h3>
      <div class="gen-date" id="genDate"></div>
      <div class="share-totals">
        <div class="unpaid">
          <div class="t-label">상환할 금액 합계 <span style="font-size:9px">(상환X 제외)</span></div>
          <div class="t-val" id="shareUnpaidTotal">-</div>
        </div>
        <div class="paid">
          <div class="t-label">상환한 금액 합계</div>
          <div class="t-val" id="sharePaidTotal">-</div>
        </div>
      </div>
      <div class="share-totals" style="margin-bottom:6px;">
        <div class="unpaid" style="background:#f1f3f6;">
          <div class="t-label">보류 금액 합계</div>
          <div class="t-val" id="shareHoldTotal" style="color:#7a8496;">-</div>
        </div>
        <div class="unpaid" style="background:#f1f3f6;">
          <div class="t-label">상환X 금액 합계</div>
          <div class="t-val" id="shareExcludeTotal" style="color:#999;">-</div>
        </div>
      </div>

      <div class="share-sec-title">갚을 목록 (미상환)</div>
      <table class="share-table" id="unpaidTable">
        <thead><tr><th>우선순위</th><th>내역</th><th>금액</th><th>계좌번호</th><th>비고</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="share-sec-title">상환완료 목록</div>
      <table class="share-table" id="paidTable">
        <thead><tr><th>내역</th><th>금액</th><th>계좌번호</th><th>비고</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const PRIORITIES = ['즉시','1순위','2순위','3순위','보류','상환X'];
const TABS = ['전체','즉시','1순위','2순위','3순위','보류','상환X','상환완료'];
const STORAGE_KEY = 'debts_v1';

const SEED = [
  {name:'컬처랩(KT)', amount:16488140, account:'농협 79018841144231', note:'컬처랩 · 확인:O', priority:'1순위', completed:false},
  {name:'컬처랩(KT텔레캅)', amount:1379775, account:'국민은행 48359073571360', note:'컬처랩 · 확인:O', priority:'1순위', completed:false},
  {name:'모아저축은행', amount:3656044, account:'저축은행 162-61-15-1478028', note:'보류 · 확인:X', priority:'보류', completed:false},
  {name:'SBI저축은행', amount:8897928, account:'저축은행 028132-13-788616', note:'보류 · 확인:X · 고객센터 1566-2210', priority:'보류', completed:false},
  {name:'하나저축은행', amount:9818479, account:'저축은행 06701151580220', note:'개인 · 확인:O', priority:'1순위', completed:false},
  {name:'우리금융저축은행', amount:1468685, account:'저축은행 403-61-15-1472055', note:'확인요 · 확인:X', priority:'보류', completed:false},
  {name:'우리은행(아이티플①)', amount:8271923, account:'우리은행 49302149118939', note:'아이티플 · 확인:O', priority:'1순위', completed:false},
  {name:'우리은행(아이티플②)', amount:29431203, account:'우리은행 294-910372-18-908', note:'아이티플 · 확인:O', priority:'1순위', completed:false},
  {name:'우리카드', amount:1204342, account:'우리은행 85802990718901', note:'확인요 → 984-190719-18-799 · 확인:X', priority:'보류', completed:false},
  {name:'이귀선', amount:330000000, account:'기업은행 01054485119', note:'확인:O', priority:'1순위', completed:false},
  {name:'김영일', amount:100000000, account:'카카오뱅크 3333055332492', note:'확인:O', priority:'1순위', completed:false},
  {name:'조기영', amount:55000000, account:'우리은행 347-08017-459', note:'확인:O', priority:'2순위', completed:false},
  {name:'김익태(아들 김대원)', amount:100000000, account:'농협 302-0318-2302-31', note:'확인:O', priority:'2순위', completed:false},
  {name:'삼촌(이혁우,청송옥)', amount:100000000, account:'국민은행 815601-04-173176', note:'확인:O', priority:'2순위', completed:false},
  {name:'여사장님(희우코리아)', amount:20000000, account:'국민은행 270901-04-156194', note:'여기까지 이체 · 확인:O', priority:'2순위', completed:false},
  {name:'허대표', amount:10000000, account:'', note:'계좌체크 필요', priority:'2순위', completed:false},
  {name:'이동현', amount:20000000, account:'우리은행 1002-633-350814', note:'', priority:'2순위', completed:false},
  {name:'이철승', amount:70000000, account:'신한은행 1102-1584-1749', note:'계좌체크 필요', priority:'2순위', completed:false},
  {name:'일권이', amount:8000000, account:'', note:'계좌체크 필요', priority:'2순위', completed:false},
  {name:'귀환이', amount:2000000, account:'', note:'계좌체크 필요', priority:'2순위', completed:false},
  {name:'법인들 결산비', amount:0, account:'', note:'금액 미정', priority:'3순위', completed:false},
  {name:'수성이 자본금', amount:0, account:'', note:'금액 미정(100 단위 확인 필요)', priority:'3순위', completed:false},
  {name:'건강보험료', amount:0, account:'', note:'금액 미정', priority:'3순위', completed:false},
  {name:'수성이 캐피탈', amount:0, account:'', note:'금액 미정', priority:'3순위', completed:false},
  {name:'홍기순', amount:200000000, account:'', note:'계획 무', priority:'상환X', completed:false},
];

let data = [];
let activeTab = '전체';
let saveTimer = null;
let isDirty = false;
let lastSavedAt = null;

function uid(){ return 'd_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function timeStr(d){
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function updateSaveUI(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  if(!btn || !status) return;
  if(isDirty){
    btn.classList.add('dirty');
    status.textContent = '변경사항 저장 대기 중…';
  }else{
    btn.classList.remove('dirty');
    status.textContent = lastSavedAt ? `저장됨 · ${timeStr(lastSavedAt)}` : '저장됨';
  }
}

function markDirty(){
  isDirty = true;
  updateSaveUI();
}

const hasCloudStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function loadData(){
  // 1) 클라우드 저장소 시도 (Claude 웹/앱 안에서 열었을 때)
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        data = JSON.parse(res.value);
        lastSavedAt = new Date();
        return;
      }
    }catch(e){ /* 클라우드 저장소 없음 → 아래에서 로컬 시도 */ }
  }
  // 2) 폰 로컬 저장소 시도 (다운로드해서 직접 열었을 때)
  try{
    const local = localStorage.getItem(STORAGE_KEY);
    if(local){
      data = JSON.parse(local);
      lastSavedAt = new Date();
      return;
    }
  }catch(e){ /* 로컬 저장소도 없음 */ }
  // 3) 둘 다 없으면 초기 데이터로 시작
  data = SEED.map(d => ({...d, id: uid()}));
  await persist(true);
}

async function persist(immediate){
  const doSave = async () => {
    const json = JSON.stringify(data);
    let cloudOk = false, localOk = false;
    if(hasCloudStorage){
      try{
        await window.storage.set(STORAGE_KEY, json, false);
        cloudOk = true;
      }catch(e){ /* 클라우드 저장 실패 → 로컬로 대체 */ }
    }
    try{
      localStorage.setItem(STORAGE_KEY, json);
      localOk = true;
    }catch(e){ /* 로컬 저장도 실패 (매우 드묾) */ }

    if(cloudOk || localOk){
      isDirty = false;
      lastSavedAt = new Date();
      updateSaveUI();
    }else{
      showToast('저장 실패 — 브라우저 저장 공간을 확인해주세요');
    }
  };
  if(immediate){ await doSave(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 450);
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('ko-KR') + '원';
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TABS.forEach(t => {
    const items = t === '전체' ? data.filter(d=>!d.completed)
                : t === '상환완료' ? data.filter(d=>d.completed)
                : data.filter(d=>!d.completed && d.priority===t);
    const btn = document.createElement('div');
    btn.className = 'tab' + (t===activeTab?' active':'') + (t==='상환완료'?' done-tab':'');
    btn.innerHTML = `${t} <span class="cnt">${items.length}</span>`;
    btn.onclick = () => { activeTab = t; render(); };
    tabsEl.appendChild(btn);
  });
}

function currentItems(){
  if(activeTab==='전체') return data.filter(d=>!d.completed);
  if(activeTab==='상환완료') return data.filter(d=>d.completed);
  return data.filter(d=>!d.completed && d.priority===activeTab);
}

function updateTotals(){
  // 상환X 제외한 미상환 합계
  const unpaid = data.filter(d=>!d.completed && d.priority!=='상환X').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const paid = data.filter(d=>d.completed).reduce((s,i)=>s+(Number(i.amount)||0),0);
  document.getElementById('unpaidTotal').textContent = fmt(unpaid);
  document.getElementById('paidTotal').textContent = fmt(paid);
}

function findItem(id){ return data.find(d=>d.id===id); }

function onField(id, field, value){
  const item = findItem(id);
  if(!item) return;
  if(field==='amount'){
    const clean = String(value).replace(/[^0-9]/g,'');
    item.amount = clean ? parseInt(clean,10) : 0;
  } else {
    item[field] = value;
  }
  markDirty();
  persist(false);
}

function onPriorityChange(id, value){
  const item = findItem(id);
  if(!item) return;
  item.priority = value;
  markDirty();
  persist(false);
  render();
}

function toggleComplete(id, val){
  const item = findItem(id);
  if(!item) return;
  item.completed = val;
  markDirty();
  persist(true);
  showToast(val ? '상환완료로 이동했습니다' : '목록으로 복원했습니다');
  render();
}

function deleteItem(id){
  const item = findItem(id);
  if(!item) return;
  if(!confirm(`'${item.name || '이름 없음'}' 항목을 삭제할까요?\n(상환완료가 아니라 완전 삭제입니다)`)) return;
  data = data.filter(d=>d.id!==id);
  markDirty();
  persist(true);
  render();
}

function addNew(){
  const defaultPriority = PRIORITIES.includes(activeTab) ? activeTab : '보류';
  const item = {id:uid(), name:'', amount:0, account:'', note:'', priority:defaultPriority, completed:false};
  data.unshift(item);
  if(activeTab==='상환완료') activeTab = defaultPriority;
  markDirty();
  persist(true);
  render();
  setTimeout(()=>{
    const el = document.querySelector(`[data-id="${item.id}"] .name-input`);
    if(el) el.focus();
  }, 60);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function cardHTML(item){
  const isDone = item.completed;
  return `
  <div class="card p-${item.priority}${isDone?' completed':''}" data-id="${item.id}">
    <div class="row1">
      <input class="name-input" placeholder="이름 / 내역" value="${escapeAttr(item.name)}"
        oninput="onField('${item.id}','name',this.value)">
      ${isDone
        ? `<span class="badge-done">상환완료</span>`
        : `<select class="prio-select" onchange="onPriorityChange('${item.id}', this.value)">
             ${PRIORITIES.map(p=>`<option value="${p}" ${p===item.priority?'selected':''}>${p}</option>`).join('')}
           </select>`}
    </div>
    <div class="field">
      <label>금액</label>
      <input class="amount" inputmode="numeric" value="${(Number(item.amount)||0).toLocaleString('ko-KR')}"
        oninput="onField('${item.id}','amount',this.value); this.value=(Number(this.value.replace(/[^0-9]/g,''))||0).toLocaleString('ko-KR');">
    </div>
    <div class="field">
      <label>계좌번호</label>
      <input placeholder="은행명 계좌번호" value="${escapeAttr(item.account)}"
        oninput="onField('${item.id}','account',this.value)">
    </div>
    <div class="field">
      <label>비고</label>
      <input placeholder="메모" value="${escapeAttr(item.note)}"
        oninput="onField('${item.id}','note',this.value)">
    </div>
    <div class="actions">
      ${isDone
        ? `<button class="btn btn-restore" onclick="toggleComplete('${item.id}', false)">↩ 목록으로 복원</button>`
        : `<button class="btn btn-done" onclick="toggleComplete('${item.id}', true)">✓ 상환완료로 이동</button>`}
      <button class="btn btn-del" onclick="deleteItem('${item.id}')">🗑</button>
    </div>
  </div>`;
}

function escapeAttr(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function render(){
  renderTabs();
  const items = currentItems();
  updateTotals();
  const listEl = document.getElementById('list');
  if(items.length===0){
    listEl.innerHTML = `<div class="empty">${activeTab==='상환완료' ? '아직 상환완료된 항목이 없습니다.' : '이 우선순위에는 항목이 없습니다.\n우측 하단 + 버튼으로 추가해보세요.'}</div>`;
    return;
  }
  // 탭별 소계
  // 전체 탭은 상단 카드와 동일하게 상환X 제외
  const sumItems = activeTab==='전체' ? items.filter(i=>i.priority!=='상환X') : items;
  const tabSum = sumItems.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const countLabel = activeTab==='상환완료' ? `상환완료 ${items.length}건` : `${activeTab} ${items.length}건`;
  const sumNote = activeTab==='전체' ? ' (상환X 제외)' : '';
  const sumBar = tabSum > 0
    ? `<div class="tab-sum-bar"><span class="tab-sum-label">${countLabel} 합계${sumNote}</span><span class="tab-sum-val">${fmt(tabSum)}</span></div>`
    : '';
  listEl.innerHTML = items.map(cardHTML).join('') + sumBar;
}

document.getElementById('fab').addEventListener('click', addNew);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  await persist(true);
  showToast('저장 완료 — 계속 작업하셔도 됩니다');
  btn.disabled = false;
});

function escapeHtml(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildShareSheet(){
  const unpaidAll = data.filter(d=>!d.completed)
    .sort((a,b)=> PRIORITIES.indexOf(a.priority) - PRIORITIES.indexOf(b.priority));
  const paid = data.filter(d=>d.completed);

  // 상환X 제외 합계
  const unpaidSum = unpaidAll.filter(i=>i.priority!=='상환X').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const paidSum = paid.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const holdSum = unpaidAll.filter(i=>i.priority==='보류').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const excludeSum = unpaidAll.filter(i=>i.priority==='상환X').reduce((s,i)=>s+(Number(i.amount)||0),0);

  document.getElementById('shareUnpaidTotal').textContent = fmt(unpaidSum);
  document.getElementById('sharePaidTotal').textContent = fmt(paidSum);
  document.getElementById('shareHoldTotal').textContent = fmt(holdSum);
  document.getElementById('shareExcludeTotal').textContent = fmt(excludeSum);

  const now = new Date();
  document.getElementById('genDate').textContent =
    `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 기준`;

  // 미상환 테이블 (상환X 포함 전체, 하단에 소계행)
  const unpaidBody = document.querySelector('#unpaidTable tbody');
  const unpaidRows = unpaidAll.map(i => `
    <tr>
      <td>${escapeHtml(i.priority)}</td>
      <td>${escapeHtml(i.name)||'-'}</td>
      <td class="amt">${(Number(i.amount)||0).toLocaleString('ko-KR')}</td>
      <td class="acc">${escapeHtml(i.account)||'-'}</td>
      <td>${escapeHtml(i.note)||''}</td>
    </tr>`).join('');
  const unpaidFooter = `
    <tr style="background:#f1f3f6; font-weight:700;">
      <td colspan="2" style="text-align:right; color:#4c5568;">합계 (상환X 제외)</td>
      <td class="amt" style="color:#b3391f;">${unpaidSum.toLocaleString('ko-KR')}</td>
      <td colspan="2"></td>
    </tr>
    <tr style="background:#f7f8fa;">
      <td colspan="2" style="text-align:right; color:#7a8496; font-size:10px;">보류 소계</td>
      <td class="amt" style="color:#7a8496; font-size:10px;">${holdSum.toLocaleString('ko-KR')}</td>
      <td colspan="2"></td>
    </tr>`;
  unpaidBody.innerHTML = (unpaidRows || `<tr><td colspan="5" style="text-align:center;color:#8792a3;">없음</td></tr>`) + unpaidFooter;

  // 상환완료 테이블 + 하단 합계행
  const paidBody = document.querySelector('#paidTable tbody');
  const paidRows = paid.map(i => `
    <tr class="paid-row">
      <td>${escapeHtml(i.name)||'-'}</td>
      <td class="amt">${(Number(i.amount)||0).toLocaleString('ko-KR')}</td>
      <td class="acc">${escapeHtml(i.account)||'-'}</td>
      <td>${escapeHtml(i.note)||''}</td>
    </tr>`).join('');
  const paidFooter = paid.length > 0 ? `
    <tr style="background:#f1f3f6; font-weight:700;">
      <td style="text-align:right; color:#4c5568;">합계</td>
      <td class="amt" style="color:#1f8a52;">${paidSum.toLocaleString('ko-KR')}</td>
      <td colspan="2"></td>
    </tr>` : '';
  paidBody.innerHTML = (paidRows || `<tr><td colspan="4" style="text-align:center;color:#8792a3;">없음</td></tr>`) + paidFooter;
}

document.getElementById('shareOpenBtn').addEventListener('click', () => {
  buildShareSheet();
  document.getElementById('shareOverlay').classList.add('show');
});
document.getElementById('shareCloseBtn').addEventListener('click', () => {
  document.getElementById('shareOverlay').classList.remove('show');
});
document.getElementById('shareCloseBtnX').addEventListener('click', () => {
  document.getElementById('shareOverlay').classList.remove('show');
});
document.getElementById('shareOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'shareOverlay') e.currentTarget.classList.remove('show');
});

document.getElementById('exportPngBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportPngBtn');
  const original = btn.textContent;
  btn.textContent = '생성 중…';
  try{
    const el = document.getElementById('shareCapture');
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2});
    const link = document.createElement('a');
    link.download = '채무정리_공유.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('이미지가 저장되었습니다');
  }catch(e){
    showToast('이미지 생성 실패');
  }
  btn.textContent = original;
});

document.getElementById('exportPdfBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportPdfBtn');
  const original = btn.textContent;
  btn.textContent = '생성 중…';
  try{
    const el = document.getElementById('shareCapture');
    const { jsPDF } = window.jspdf;
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2});
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgW = pageWidth - 40;
    const imgH = (canvas.height * imgW) / canvas.width;
    let heightLeft = imgH;
    let position = 20;
    pdf.addImage(imgData, 'PNG', 20, position, imgW, imgH);
    heightLeft -= (pageHeight - 40);
    while(heightLeft > 0){
      position = heightLeft - imgH + 20;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 20, position, imgW, imgH);
      heightLeft -= (pageHeight - 40);
    }
    pdf.save('채무정리_공유.pdf');
    showToast('PDF가 저장되었습니다');
  }catch(e){
    showToast('PDF 생성 실패');
  }
  btn.textContent = original;
});

(async function init(){
  document.getElementById('list').innerHTML = `<div class="status-bar">불러오는 중…</div>`;
  await loadData();
  updateSaveUI();
  render();
})();
</script>
